services:

  mysql:
    image: mysql:8.4
    container_name: employee-mysql

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-employee_management}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}

    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5


  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: employee-management-api:latest
    container_name: employee-management-api

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://employee-mysql:3306/employee_management}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      SERVER_PORT: ${SERVER_PORT:-8080}

    ports:
      - "${APP_HOST_PORT:-8080}:8080"


volumes:
  mysql_data: