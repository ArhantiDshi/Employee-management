spring.application.name=employee-management-api

# ===============================
# Database Configuration
# ===============================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Existing Railway databases are baselined at version 1. Fresh databases run V1 and V2.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# ===============================
# Server
# ===============================
server.port=${PORT:${SERVER_PORT:8080}}

# Security configuration. Set these in Railway and your local environment.
app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=${JWT_ISSUER:employee-management-api}
